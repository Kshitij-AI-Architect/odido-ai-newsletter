<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Odido AI Newsletter</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* ── Odido brand tokens ───────────────────────────────── */
    :root {
      --odido-magenta:   #E2007A;
      --odido-magenta-dk:#B3005F;
      --odido-purple:    #3D0050;
      --odido-light:     #FFF0F7;
      --odido-gray-bg:   #F7F7F9;
      --odido-gray-line: #E4E4EA;
      --text-primary:    #1A1A2E;
      --text-secondary:  #555568;
      --radius:          12px;
      --shadow:          0 2px 16px rgba(62,0,80,.08);
    }

    /* ── Reset & base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--odido-gray-bg);
      color: var(--text-primary);
      line-height: 1.65;
    }
    a { color: var(--odido-magenta); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Top nav bar ──────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, var(--odido-purple) 0%, var(--odido-magenta) 100%);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -.3px;
    }
    .logo-dot {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900;
      color: var(--odido-magenta);
      font-size: 1rem;
      flex-shrink: 0;
    }
    .header-tag {
      background: rgba(255,255,255,.18);
      color: #fff;
      font-size: .75rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    /* ── Hero banner ──────────────────────────────────────── */
    .hero {
      background: linear-gradient(160deg, var(--odido-purple) 0%, var(--odido-magenta) 100%);
      color: #fff;
      padding: 56px 24px 48px;
      text-align: center;
    }
    .hero h1 {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -.5px;
      margin-bottom: 12px;
    }
    .hero p {
      font-size: 1.05rem;
      opacity: .85;
      max-width: 520px;
      margin: 0 auto 24px;
    }
    .hero-meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 24px;
      padding: 6px 16px;
      font-size: .85rem;
      color: rgba(255,255,255,.9);
    }
    .hero-meta span { opacity: .6; }

    /* ── Main layout ──────────────────────────────────────── */
    main {
      max-width: 820px;
      margin: -28px auto 64px;
      padding: 0 16px;
    }

    /* ── Intro card ───────────────────────────────────────── */
    .intro-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 28px 32px;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--odido-magenta);
      margin-bottom: 28px;
      font-size: 1.05rem;
      color: var(--text-secondary);
    }
    .intro-card strong { color: var(--text-primary); }

    /* ── Section cards ────────────────────────────────────── */
    .section-block {
      margin-bottom: 36px;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .section-header h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .section-pill {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      padding: 3px 10px;
      border-radius: 12px;
      background: var(--odido-light);
      color: var(--odido-magenta);
    }

    .article-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 22px 26px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border-top: 3px solid transparent;
      transition: box-shadow .2s, transform .2s;
    }
    .article-card:hover {
      box-shadow: 0 6px 28px rgba(226,0,122,.12);
      transform: translateY(-2px);
    }
    .article-card.research  { border-top-color: #7C3AED; }
    .article-card.industry  { border-top-color: var(--odido-magenta); }
    .article-card.use-cases { border-top-color: #0EA5E9; }

    .article-card h3 {
      font-size: 1.02rem;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.35;
    }
    .article-card h3 a { color: var(--text-primary); }
    .article-card h3 a:hover { color: var(--odido-magenta); text-decoration: none; }
    .article-meta {
      font-size: .8rem;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .article-meta .dot { opacity: .35; }
    .article-summary {
      font-size: .94rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* ── Closing card ─────────────────────────────────────── */
    .closing-card {
      background: linear-gradient(135deg, var(--odido-purple), var(--odido-magenta));
      color: #fff;
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
      margin-top: 8px;
    }
    .closing-card h2 { font-size: 1.2rem; margin-bottom: 10px; }
    .closing-card p  { opacity: .88; font-size: .97rem; }

    /* ── Loading / error states ───────────────────────────── */
    #loading {
      text-align: center;
      padding: 64px 0;
      color: var(--text-secondary);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--odido-gray-line);
      border-top-color: var(--odido-magenta);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ───────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 24px;
      font-size: .8rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--odido-gray-line);
    }
    footer strong { color: var(--odido-magenta); }

    /* ── Responsive ───────────────────────────────────────── */
    @media (max-width: 600px) {
      .hero { padding: 40px 16px 36px; }
      .intro-card, .article-card { padding: 18px; }
    }
  </style>
</head>
<body>

<!-- ── Nav bar ─────────────────────────────────────────────── -->
<header>
  <div class="logo">
    <div class="logo-dot">O</div>
    Odido
  </div>
  <div class="header-tag">AI Newsletter</div>
</header>

<!-- ── Hero ───────────────────────────────────────────────── -->
<div class="hero">
  <h1 id="hero-title">AI Newsletter</h1>
  <p>Your weekly digest of the most important AI &amp; LLM developments — curated and summarised automatically.</p>
  <div class="hero-meta">
    <span>🤖 Auto-generated</span>
    <span>·</span>
    <span id="hero-date">Loading…</span>
  </div>
</div>

<!-- ── Content ─────────────────────────────────────────────── -->
<main>
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading newsletter…</p>
  </div>
  <div id="newsletter-content" style="display:none"></div>
</main>

<footer>
  Auto-generated by the <strong>Odido AI Newsletter Pipeline</strong> · Powered by Azure OpenAI &amp; Hugging Face
</footer>

<script>
  /* ─── Parse and render newsletter.md ────────────────────── */

  const SECTION_CLASS = {
    "Research Highlights": "research",
    "Industry News":       "industry",
    "Cool Use Cases":      "use-cases",
  };

  const SECTION_EMOJI = {
    "Research Highlights": "🔬",
    "Industry News":       "📰",
    "Cool Use Cases":      "💡",
  };

  async function loadNewsletter() {
    const res = await fetch("newsletter.md");
    if (!res.ok) throw new Error(`Could not load newsletter.md (${res.status})`);
    return res.text();
  }

  function parseNewsletter(md) {
    const lines = md.split("\n");
    const result = { title: "", date: "", intro: "", sections: [], closing: "" };
    let currentSection = null;
    let currentArticle = null;
    let mode = "intro";        // intro | section | closing
    let introLines = [];
    let closingLines = [];

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      // H1 → newsletter title + date
      if (line.startsWith("# ")) {
        result.title = line.slice(2).trim();
        const m = result.title.match(/Week of (.+)/);
        result.date = m ? m[1] : "";
        continue;
      }

      // H2 sections
      if (line.startsWith("## ")) {
        const heading = line.slice(3).trim().replace(/^[^\w]+/, "").trim();

        if (heading.startsWith("This Week") || heading.startsWith("👋 This Week")) {
          mode = "intro"; continue;
        }
        if (heading.startsWith("Until Next Week") || heading.startsWith("👋 Until")) {
          mode = "closing"; continue;
        }

        // It's a real content section
        if (currentArticle) { currentSection.articles.push(currentArticle); currentArticle = null; }
        if (currentSection)  { result.sections.push(currentSection); }

        const cleanName = heading.replace(/^[\u{1F300}-\u{1FFFF}\s]+/u, "").trim();
        currentSection = { name: cleanName, articles: [] };
        mode = "section";
        continue;
      }

      // H3 → new article within a section
      if (line.startsWith("### ") && currentSection) {
        if (currentArticle) currentSection.articles.push(currentArticle);
        const raw = line.slice(4).trim();
        const linkMatch = raw.match(/^\[(.+?)\]\((.+?)\)$/);
        currentArticle = {
          title: linkMatch ? linkMatch[1] : raw,
          url:   linkMatch ? linkMatch[2] : "",
          meta: "",
          summary: [],
        };
        continue;
      }

      // Italic meta line under article title
      if (line.startsWith("*") && line.endsWith("*") && currentArticle && !currentArticle.meta) {
        currentArticle.meta = line.slice(1, -1);
        continue;
      }

      // HR (---) → skip
      if (/^-{3,}$/.test(line.trim())) continue;

      // Blockquote / badge → skip
      if (line.startsWith(">")) continue;

      // Collect summary text
      if (currentArticle && line.trim()) {
        currentArticle.summary.push(line.trim());
        continue;
      }

      // Intro / closing text
      if (mode === "intro"   && line.trim() && !line.startsWith("#"))
        introLines.push(line.trim());
      if (mode === "closing" && line.trim() && !line.startsWith("#") && !line.startsWith("*"))
        closingLines.push(line.trim());
    }

    // Flush last article / section
    if (currentArticle) currentSection?.articles.push(currentArticle);
    if (currentSection)  result.sections.push(currentSection);

    result.intro   = introLines.join(" ");
    result.closing = closingLines.join(" ");
    return result;
  }

  function renderNewsletter(data) {
    const container = document.getElementById("newsletter-content");

    // Update hero
    document.getElementById("hero-title").textContent = "AI Newsletter";
    if (data.date)
      document.getElementById("hero-date").textContent = data.date;

    let html = "";

    // Intro card
    if (data.intro) {
      html += `<div class="intro-card">${escHtml(data.intro)}</div>`;
    }

    // Sections
    for (const section of data.sections) {
      if (!section.articles.length) continue;
      const cls    = SECTION_CLASS[section.name] || "industry";
      const emoji  = SECTION_EMOJI[section.name] || "📌";
      const count  = section.articles.length;

      html += `
        <div class="section-block">
          <div class="section-header">
            <h2>${emoji} ${escHtml(section.name)}</h2>
            <span class="section-pill">${count} article${count !== 1 ? "s" : ""}</span>
          </div>`;

      for (const art of section.articles) {
        const titleHtml = art.url
          ? `<a href="${escHtml(art.url)}" target="_blank" rel="noopener">${escHtml(art.title)}</a>`
          : escHtml(art.title);

        html += `
          <div class="article-card ${cls}">
            <h3>${titleHtml}</h3>
            ${art.meta ? `<div class="article-meta">${escHtml(art.meta)}</div>` : ""}
            <div class="article-summary">${escHtml(art.summary.join(" "))}</div>
          </div>`;
      }

      html += `</div>`;
    }

    // Closing
    if (data.closing) {
      html += `
        <div class="closing-card">
          <h2>Until Next Week 👋</h2>
          <p>${escHtml(data.closing)}</p>
        </div>`;
    }

    container.innerHTML = html;
    document.getElementById("loading").style.display = "none";
    container.style.display = "block";
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Boot
  loadNewsletter()
    .then(md => renderNewsletter(parseNewsletter(md)))
    .catch(err => {
      document.getElementById("loading").innerHTML =
        `<p style="color:#E2007A">⚠️ ${err.message}<br><small>Make sure newsletter.md is in the same folder and you're serving via a local server.</small></p>`;
    });
</script>
</body>
</html>
