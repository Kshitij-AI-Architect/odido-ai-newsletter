name: Weekly AI Newsletter

on:
  # Run every Monday at 08:00 UTC (10:00 Amsterdam time)
  schedule:
    - cron: "0 8 * * 1"

  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days back to look for articles"
        required: false
        default: "7"

jobs:
  generate-newsletter:
    name: Generate Newsletter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter pipeline
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          # Use manual input if triggered via UI, otherwise default to 90 days
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || 90 }}
        run: |
          python run_pipeline.py \
            --lookback-days $LOOKBACK_DAYS \
            --output newsletter.md

      - name: Commit and push newsletter
        run: |
          git config user.name  "Odido Newsletter Pipeline"
          git config user.email "newsletter@odido.nl"
          git add newsletter.md
          git diff --cached --quiet || git commit -m "newsletter: weekly update $(date +'%Y-%m-%d')"
          git push
